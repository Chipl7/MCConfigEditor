[project]
name = "mcconfigeditor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "artem.chipl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mcconfigeditor = "mcconfigeditor:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]
